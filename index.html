<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Family Tree</title>
  <link rel="stylesheet" href="style.css">
  <script src="d3.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div id="loadingScreen">
    <div class="spinner"></div>
    <p>Loading family tree…</p>
  </div>

  <header class="app-header">
    <div class="header-main">
      <div class="brand">
        <span class="brand-mark">🌳</span>
        <div class="head-edit">
          <label class="micro-label" for="mainPersonInput">Family head</label>
          <div class="inline-edit">
            <input id="mainPersonInput" type="text" placeholder="Root name…" autocomplete="off">
            <button type="button" class="btn btn-primary btn-xs" onclick="saveMainPersonName()">Save</button>
          </div>
        </div>
        <div class="viewing-as">
          <p class="micro-label">Viewing as</p>
          <p class="focus-name" id="focusStatus">—</p>
        </div>
      </div>
      <div class="header-tools">
        <button type="button" class="btn" onclick="toggleMembersPanel()">People</button>
        <button type="button" class="icon-btn" id="menuToggle" onclick="toggleHeaderMenu()" aria-label="More">☰</button>
      </div>
    </div>

    <div class="header-search">
      <span class="search-icon">🔍</span>
      <input id="searchInput" type="search" placeholder="Search relative…" autocomplete="off" oninput="handleSearch(this.value)">
    </div>

    <div id="headerMenu" class="header-actions hidden">
      <div class="menu-head-edit">
        <label class="micro-label" for="mainPersonInputMenu">Family head</label>
        <div class="inline-edit">
          <input id="mainPersonInputMenu" type="text" placeholder="Root name…" autocomplete="off">
          <button type="button" class="btn btn-primary btn-xs" onclick="saveMainPersonName(true)">Save</button>
        </div>
      </div>
      <button type="button" class="btn" onclick="exportFamilyJson()">Export</button>
      <label class="btn file-btn">
        Import
        <input type="file" accept=".json" onchange="importFamilyJson(event)">
      </label>
      <button type="button" class="btn" onclick="toggleEventsPanel()">Events</button>
      <button type="button" class="btn" onclick="resetZoom()">Fit view</button>
      <button type="button" class="btn btn-danger" onclick="clearStorageAndReset()">Reset</button>
    </div>
  </header>

  <div id="viewport">
    <svg id="treeCanvas"></svg>
    <div id="nodesLayer"></div>
  </div>

  <button type="button" class="fab" onclick="toggleMembersPanel()" title="Family members">👥</button>

  <aside id="membersDrawer" class="drawer hidden">
    <div class="drawer-head">
      <div>
        <h2>Family members</h2>
        <p class="muted"><span id="memberCount">0</span> people</p>
      </div>
      <button type="button" class="icon-btn" onclick="toggleMembersPanel()" aria-label="Close">✕</button>
    </div>
    <input id="memberFilter" type="search" placeholder="Filter names…" autocomplete="off" oninput="updateMembersList()">
    <div id="focusActions" class="focus-actions"></div>
    <div id="membersList" class="members-list"></div>
  </aside>

  <aside id="eventsDrawer" class="drawer drawer-narrow hidden">
    <div class="drawer-head">
      <h2>Upcoming (30 days)</h2>
      <button type="button" class="icon-btn" onclick="toggleEventsPanel()" aria-label="Close">✕</button>
    </div>
    <div id="eventsList" class="events-list"></div>
  </aside>

  <div id="addModal" class="modal-overlay hidden">
    <div class="modal">
      <button type="button" class="modal-close" onclick="closeModal('addModal')">✕</button>
      <h3 id="modalTitle">Add relative</h3>
      <p id="modalSubtitle" class="muted">Enter details below</p>
      <form id="memberForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="formTargetId" value="">
        <input type="hidden" id="formRelationType" value="">
        <label class="field">
          <span>Full name *</span>
          <input type="text" id="formFullName" required placeholder="Full name" autocomplete="off">
        </label>
        <label class="field">
          <span>Gender *</span>
          <select id="formGender">
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </label>
        <div class="field-grid">
          <label class="field">
            <span>Birth date</span>
            <input type="date" id="formDob" oninput="syncDobToAge('formDob', 'formAge')">
          </label>
          <label class="field">
            <span>Age (years)</span>
            <input type="number" id="formAge" min="0" max="130" placeholder="e.g. 25" inputmode="numeric" oninput="syncAgeToDob('formAge', 'formDob')">
          </label>
        </div>
        <label id="anniversaryGroup" class="field hidden">
          <span>Anniversary date</span>
          <input type="date" id="formAnniversary">
        </label>
        <div class="modal-actions">
          <button type="button" class="btn" onclick="closeModal('addModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save & update</button>
        </div>
      </form>
    </div>
  </div>

  <div id="editModal" class="modal-overlay hidden">
    <div class="modal">
      <button type="button" class="modal-close" onclick="closeModal('editModal')">✕</button>
      <h3>Edit member</h3>
      <p class="muted">Update details</p>
      <form id="editForm" onsubmit="handleEditFormSubmit(event)">
        <input type="hidden" id="editMemberId" value="">
        <label class="field">
          <span>Full name *</span>
          <input type="text" id="editFullName" required placeholder="Full name" autocomplete="off">
        </label>
        <label class="field">
          <span>Gender *</span>
          <select id="editGender">
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </label>
        <div class="field-grid">
          <label class="field">
            <span>Birth date</span>
            <input type="date" id="editDob" oninput="syncDobToAge('editDob', 'editAge')">
          </label>
          <label class="field">
            <span>Age (years)</span>
            <input type="number" id="editAge" min="0" max="130" placeholder="e.g. 25" inputmode="numeric" oninput="syncAgeToDob('editAge', 'editDob')">
          </label>
        </div>
        <label id="editAnniversaryGroup" class="field">
          <span>Anniversary date</span>
          <input type="date" id="editAnniversary">
        </label>
        <div class="modal-actions">
          <button type="button" class="btn" onclick="closeModal('editModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
